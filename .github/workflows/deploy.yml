name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main # Или master, как у вас названа основная ветка

# Даём воркфлоу права на деплой
permissions:
  contents: read
  pages: write
  id-token: write

# Блокируем одновременные запуски, чтобы не было гонки и хуйни в логах
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v4

      - name: Загрузка артефактов
        # Если у вас чистый HTML/CSS/JS без сборщиков, путь '.' заберёт всё из корня.
        # Если будете использовать Vite/Webpack, поменяй путь на 'dist' или 'build'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
